<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Workspaces</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <style>
      html, body, #app { height: 100%; }
      .sp { display: flex; height: 100%; }
      .sp main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        width: 56px;
        flex: none;
        padding: 12px 0;
        overflow-y: auto;
        scrollbar-width: none;
        border-right: 1px solid var(--border);
        background: var(--rack);
      }
      .rail-item {
        position: relative;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        flex: none;
        padding: 0;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: background-color 0.12s var(--ease), scale 0.1s var(--ease);
      }
      .rail-item:hover { background: var(--hover); }
      .rail-item:active { scale: 0.96; }
      .rail-item .badge { overflow: visible; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.06); }
      .rail-item.current .badge { box-shadow: 0 0 0 2px var(--rack), 0 0 0 4px var(--accent); }
      .rail-item.current:hover { background: transparent; }
      .rail-item.open:not(.current)::after {
        content: '';
        position: absolute;
        right: 3px;
        bottom: 3px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 2px var(--rack);
      }
      .rail-item.drop { box-shadow: inset 0 0 0 2px var(--accent); }
      .rail-item.add { width: 32px; height: 32px; margin-top: 2px; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--border-strong); }
      .rail-item.add:hover { color: var(--text); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
