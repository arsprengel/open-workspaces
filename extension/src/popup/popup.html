<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Workspaces</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <style>
      html, body { width: 360px; }
      .popup { display: flex; flex-direction: column; min-height: 480px; max-height: 590px; }
      .popup-head { display: flex; align-items: center; gap: 4px; padding: 12px 10px 8px 12px; }
      .popup-search { flex: 1; }
      .popup-search .input { height: 38px; border-radius: 10px; }
      .popup-current { padding: 2px 12px 4px; }
      .popup-current .sw-name { font-size: 20px; }
      .moving { display: flex; align-items: center; gap: 8px; padding: 2px 16px 6px; font-size: 12px; min-width: 0; }
      .popup .list { flex: 1; overflow: auto; padding: 0 6px 8px; min-height: 120px; }
      .popup .list .row { min-height: 44px; padding: 6px 10px 6px 7px; gap: 12px; }
      .popup .list .row .title { font-weight: 550; }
      .popup-foot { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-top: 1px solid var(--border); background: var(--surface); }
      .keys { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11.5px; }
      .keys .kbd + .kbd, .keys .kbd:not(:first-child) { margin-left: 6px; }
      .pin-ask { display: flex; flex-direction: column; gap: 14px; padding: 14px; }
      /* Weight, not size, sets the question apart: the swatch name above is the one large line. */
      .pin-ask-q { margin: 0 0 3px; font-size: inherit; font-weight: 700; line-height: 1.35; text-wrap: pretty; }
      .pin-ask p { margin: 0; text-wrap: pretty; }
      .pin-ask-actions { display: flex; gap: 8px; }
      .pin-ask-actions .btn { flex: 1; justify-content: center; }
      .pin-ask-mute { align-self: center; margin-top: -6px; }
      /* The popup grows with its content, so give modals room. */
      .popup .overlay { position: fixed; }
      .popup .modal { padding: 16px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
