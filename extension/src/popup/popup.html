<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Workspaces</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <style>
      html, body { width: 360px; }
      .popup { display: flex; flex-direction: column; max-height: 580px; min-height: 480px; }
      .popup .current { padding: 8px 10px; margin: 2px 0 4px; border-radius: var(--radius); background: var(--surface); }
      .popup .list { flex: 1; overflow: auto; padding: 0 6px 6px; min-height: 120px; }
      .popup footer { padding: 6px 8px; border-top: 1px solid var(--border); }
      /* The popup grows with its content, so give modals room. */
      .popup .overlay { position: fixed; }
      .popup .modal { padding: 14px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
