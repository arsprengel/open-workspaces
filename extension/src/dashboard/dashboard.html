<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Workspaces</title>
    <link rel="icon" href="../../icons/icon-32.png" />
    <link rel="stylesheet" href="../ui/theme.css" />
    <style>
      html, body, #app { height: 100%; }
      .dash { display: flex; height: 100%; }
      .dash main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .sidebar {
        width: 260px;
        flex: none;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: var(--surface);
      }
      .sidebar .search .input { background: var(--bg); border-color: var(--border); }
      .sidebar-scroll { flex: 1; overflow-y: auto; padding-bottom: 8px; }
      .sidebar-foot { padding: 6px; border-top: 1px solid var(--border); }
      .sidebar-foot .row { color: var(--muted); }
      @media (max-width: 640px) {
        .sidebar { width: 200px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="dashboard.js"></script>
  </body>
</html>
