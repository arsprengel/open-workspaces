name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should it work?
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to help implement this
