name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open workspace "A"
        2. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 141, Brave 1.80, Helium 0.5
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Open Workspaces version
      placeholder: e.g. 0.1.0 (shown at the bottom of Settings)
  - type: textarea
    id: logs
    attributes:
      label: Errors
      description: Optional. chrome://extensions → Open Workspaces → "Errors" or "Inspect views: service worker" console output.
      render: text
